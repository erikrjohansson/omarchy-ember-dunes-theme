[bar]
background = "#0B0907"
background-alpha = 0.98
text = "#E3D7C8"
active = "#F2A766"
scale-with-font = true
size-horizontal = 26
size-vertical = 28

[hyprland]
active-border = "#A06A44"
active-border-foreground = "#A06A44"

[controls]
normal-color = "#E3D7C8"
normal-fill-alpha = 0.04
normal-border = "#E3D7C8"
normal-border-width = 1
normal-border-alpha = 0.4
hover-cursor-color = "#F2A766"
hover-cursor-fill-alpha = 0.08
hover-cursor-border = "#F2A766"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.25
focus-color = "#F2A766"
focus-fill-alpha = 0.08
focus-border = "#F2A766"
focus-border-width = 1
focus-border-alpha = 0.65
selected-color = "#F2A766"
selected-fill-alpha = 0.18
selected-border = "#F2A766"
selected-border-width = 0
selected-border-alpha = 1.0
pressed-fill-alpha = 0.22
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
background = "#0B0907"
background-alpha = 0.95
text = "#E3D7C8"
border = "hyprland.active-border"
border-alpha = 1.0
border-width = 1

[tooltip]
background = "#0B0907"
background-alpha = 0.95
text = "#E3D7C8"
border = "#4E3424"
border-alpha = 1.0

[notifications]
background = "#0B0907"
background-alpha = 0.95
text = "#E3D7C8"
border = "hyprland.active-border"
border-alpha = 1.0
border-width = 1
countdown = "#F2A766"

[launcher]
background = "#0B0907"
background-alpha = 0.95
text = "#E3D7C8"
border = "hyprland.active-border-foreground"
border-alpha = 1.0
scrim = "#050403"
scrim-alpha = 0.35
selected-background = "#45301F"
selected-background-alpha = 1.0
selected-text = "#F3EBE0"
selected-border = "#F2A766"
selected-border-alpha = 0.35

[menu]
background = "#0B0907"
background-alpha = 0.95
text = "#E3D7C8"
border = "hyprland.active-border-foreground"
border-alpha = 1.0
scrim = "#050403"
scrim-alpha = 0.35
selected-background = "#45301F"
selected-background-alpha = 1.0
selected-text = "#F3EBE0"
selected-border = "#F2A766"
selected-border-alpha = 0.35

[polkit]
background = "#0B0907"
background-alpha = 0.95
text = "#E3D7C8"
text-error = "#EC6A48"
border = "hyprland.active-border"
border-error = "#EC6A48"
border-alpha = 1.0
scrim = "#050403"
scrim-alpha = 0.5
accent = "#F2A766"

[lock]
background = "#0B0907"
background-alpha = 0.95
text = "#E3D7C8"
placeholder = "#B0A291"
text-error = "#EC6A48"
border = "#4E3424"
border-active = "#F2A766"
border-error = "#EC6A48"
border-alpha = 1.0
selection = "#F2A766"
selection-alpha = 0.15

[image-picker]
scrim = "#050403"
scrim-alpha = 0.5
text = "#E3D7C8"
selected-border = "#F2A766"
selected-border-alpha = 1.0
unselected-border = "#E3D7C8"
unselected-border-alpha = 0.28
